[workspace]
members = [
    "crates/synapse-core",
    "crates/synapse-cli",
    "crates/synapse-eval",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Synapse-Mux Contributors"]
license = "Apache-2.0"
repository = "https://github.com/sagarrathi16/102"

[workspace.dependencies]
synapse-core = { path = "crates/synapse-core" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3.17"
async-trait = "0.1"
uuid = { version = "1.13", features = ["v4", "serde"] }
regex = "1.11"

